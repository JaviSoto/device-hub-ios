[package]
name = "device-hub-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Domain-level C ABI for Device Hub's private iOS transport"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]
name = "device_hub_ffi"

[dependencies]
crc32fast = "1.5"
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
idevice = { path = "../../Vendor/idevice/idevice", default-features = false, features = ["ring", "remote_pairing", "tunnel_tcp_stack", "display_stream", "mobile_image_mounter"] }
plist = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.6"
tokio = { version = "1.53", features = ["io-util", "net", "rt", "sync", "time"] }
uuid = "1.24"
zeroize = { version = "1.8", features = ["derive"] }

[package.metadata.device-hub]
idevice-upstream = "https://github.com/jkcoxson/idevice.git"
idevice-revision = "a64b8867815b3da17b5c927531bdba877e8456ef"
