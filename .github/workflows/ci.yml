name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install project tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Lint Swift and source
        run: mise run lint:source

      - name: Build protocol bridge
        run: mise run protocol:build

      - parallel:
          - name: Test build tooling
            run: mise run test:support

          - name: Lint shell scripts
            run: mise run lint:shell

          - name: Test Rust protocol
            env:
              DEVICE_HUB_GUARD_LOCK_PATH: ${{ runner.temp }}/device-hub-test-rust.lock
            run: mise run test:rust

          - name: Test Swift packages
            env:
              DEVICE_HUB_GUARD_LOCK_PATH: ${{ runner.temp }}/device-hub-test-swift.lock
              SWIFT_SCRATCH_PATH: ${{ runner.temp }}/DeviceHubSwiftTests
            run: mise run test:swift

          - name: Test native media boundary
            env:
              DEVICE_HUB_GUARD_LOCK_PATH: ${{ runner.temp }}/device-hub-test-media.lock
            run: mise run test:media

          - name: Verify protocol bridge
            env:
              DEVICE_HUB_GUARD_LOCK_PATH: ${{ runner.temp }}/device-hub-verify-protocol.lock
            run: mise run protocol:verify

          - name: Build iOS app
            env:
              DEVICE_HUB_GUARD_LOCK_PATH: ${{ runner.temp }}/device-hub-build-app.lock
              CONFIGURATION: Release
              CODE_SIGNING_ALLOWED: "NO"
              DERIVED_DATA_PATH: ${{ runner.temp }}/DeviceHubDerivedData
            run: mise run build:app
